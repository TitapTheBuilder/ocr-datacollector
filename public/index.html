<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجموعه داده خوانش دستی فارسی</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>مجموعه داده خوانش دستی فارسی</h1>
    <div class="subtitle">تصویر دست‌نوشته خود را برای آموزش مدل OCR ارسال کنید</div>
  </header>

  <div class="container">
    <div id="statusMsg" class="status-msg"></div>

    <div id="promptCard" class="prompt-card">
      <div class="prompt-label">متن زیر را با دست بنویسید و عکس بگیرید</div>
      <div id="promptCategory" class="prompt-category"></div>
      <div id="promptText" class="prompt-text">در حال بارگذاری...</div>
    </div>

    <div class="capture-area">
      <div class="capture-buttons">
        <label for="cameraInput" class="btn btn-primary">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          عکس بگیرید
        </label>
        <label for="fileInput" class="btn btn-outline">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          فایل انتخاب کنید
        </label>
      </div>
      <input type="file" id="cameraInput" class="file-input" accept="image/*" capture="environment">
      <input type="file" id="fileInput" class="file-input" accept="image/*">

      <div id="previewContainer" class="preview-container">
        <img id="previewImg" class="preview-img" alt="پیش‌نمایش">
        <div class="preview-actions">
          <button id="btnSubmit" class="btn btn-success">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            تایید و ارسال
          </button>
          <button id="btnRetake" class="btn btn-outline">بازگشت</button>
        </div>
      </div>

      <div class="custom-text-section">
        <button id="customTextToggle" class="custom-text-toggle">متن دلخواه بنویسید</button>
        <div id="customTextForm" class="custom-text-form">
          <input type="text" id="customTextInput" class="custom-text-input" placeholder="متن دلخواه خود را اینجا تایپ کنید...">
          <button id="btnCustomSubmit" class="btn btn-primary btn-block" disabled>
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            تایید و ارسال
          </button>
        </div>
      </div>
    </div>

    <div id="statsBar" class="stats-bar"></div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
