<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مجموعه داده خوانش دستی فارسی</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>مجموعه داده خوانش دستی فارسی</h1>
    <div class="subtitle">تصویر دست‌نوشته خود را برای آموزش مدل OCR ارسال کنید</div>
  </header>

  <div class="container">
    <div id="statusMsg" class="status-msg"></div>

    <div id="promptCard" class="prompt-card">
      <div class="prompt-top-bar">
        <span id="promptCategory" class="prompt-category"></span>
        <button id="btnNextPrompt" class="btn-text" type="button" title="دریافت متن جدید">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          متن دیگر
        </button>
      </div>
      <div class="prompt-label">متن زیر را با دست روی تخته بنویسید یا عکس بگیرید</div>
      <div id="promptText" class="prompt-text">در حال بارگذاری...</div>
    </div>

    <div class="capture-area">
      <div class="custom-text-section">
        <button id="customTextToggle" class="custom-text-toggle" type="button">✏️ نوشتن متن دلخواه به جای متن پیشنهادی</button>
        <div id="customTextForm" class="custom-text-form">
          <input type="text" id="customTextInput" class="custom-text-input" placeholder="متن دست‌نویس خود را اینجا بنویسید...">
        </div>
      </div>

      <!-- Mode Switcher Tabs -->
      <div class="mode-tabs">
        <button type="button" id="tabModeWhiteboard" class="mode-tab active" data-mode="whiteboard">
          ✍️ تخته دست‌نویس (وایت‌برد)
        </button>
        <button type="button" id="tabModeUpload" class="mode-tab" data-mode="upload">
          📷 عکاسی یا بارگذاری تصویر
        </button>
      </div>

      <!-- Whiteboard Section -->
      <div id="whiteboardSection" class="mode-section active">
        <div class="canvas-wrapper">
          <canvas id="whiteboardCanvas"></canvas>
          <div id="canvasPlaceholder" class="canvas-placeholder">
            <span>اینجا با انگشت، قلم یا ماوس بنویسید...</span>
          </div>
        </div>

        <div class="canvas-toolbar">
          <div class="toolbar-group">
            <button type="button" id="toolPen" class="tool-btn active" title="قلم">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
              قلم
            </button>
            <button type="button" id="toolEraser" class="tool-btn" title="پاک‌کن">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 20Z"/><path d="M17 17L7 7"/></svg>
              پاک‌کن
            </button>
          </div>

          <div class="toolbar-group">
            <span class="toolbar-label">ضخامت:</span>
            <div class="width-selector">
              <button type="button" class="width-btn" data-width="3" title="نازک"><span class="dot dot-sm"></span></button>
              <button type="button" class="width-btn active" data-width="6" title="متوسط"><span class="dot dot-md"></span></button>
              <button type="button" class="width-btn" data-width="10" title="درشت"><span class="dot dot-lg"></span></button>
            </div>
          </div>

          <div class="toolbar-group">
            <span class="toolbar-label">رنگ:</span>
            <div class="color-selector">
              <button type="button" class="color-btn active" data-color="#111827" style="background:#111827;" title="مشکی"></button>
              <button type="button" class="color-btn" data-color="#1d4ed8" style="background:#1d4ed8;" title="آبی"></button>
            </div>
          </div>

          <div class="toolbar-group toolbar-actions">
            <button type="button" id="btnUndo" class="tool-btn-secondary" title="مرحله قبل (Undo)">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
              بازگشت
            </button>
            <button type="button" id="btnClear" class="tool-btn-secondary danger" title="پاک کردن کل تخته">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              پاک‌کردن
            </button>
          </div>
        </div>

        <div class="whiteboard-actions" style="margin-top:16px;">
          <button id="btnSubmitWhiteboard" class="btn btn-success btn-block" type="button">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            تایید و ارسال دست‌نویس
          </button>
        </div>
      </div>

      <!-- Upload / Camera Section -->
      <div id="uploadSection" class="mode-section" style="display:none;">
        <div class="capture-buttons" style="margin-top: 16px;">
          <label for="cameraInput" class="btn btn-primary">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            عکس بگیرید
          </label>
          <label for="fileInput" class="btn btn-outline">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            فایل انتخاب کنید
          </label>
          <button type="button" id="btnPaste" class="btn btn-outline">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
            الصاق کلیپ‌بورد
          </button>
        </div>
        <div class="paste-hint">یا تصویر را در صفحه کپی کرده و با فشردن کلیدهای Ctrl+V الصاق کنید</div>
        <input type="file" id="cameraInput" class="file-input" accept="image/*" capture="environment">
        <input type="file" id="fileInput" class="file-input" accept="image/*">
        <!-- Anti-bot honeypot field (hidden from real users) -->
        <input type="text" id="hpWebsite" name="hp_website" style="display:none !important;" tabindex="-1" autocomplete="off" aria-hidden="true">

        <div id="previewContainer" class="preview-container">
          <div id="previewLabelBox" class="preview-label-box">
            <span>متن ارسالی: </span>
            <strong id="previewLabelText">—</strong>
          </div>
          <img id="previewImg" class="preview-img" alt="پیش‌نمایش">
          <div class="preview-actions">
            <button id="btnSubmit" class="btn btn-success" type="button">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
              تایید و ارسال
            </button>
            <button id="btnRetake" class="btn btn-outline" type="button">بازگشت</button>
          </div>
        </div>
      </div>
    </div>

    <div id="statsBar" class="stats-bar"></div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
